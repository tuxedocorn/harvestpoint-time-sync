name: Harvestpoint Sync

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 7am Mountain Time
  workflow_dispatch:        # Also allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          HARVESTPOINT_EMAIL: ${{ secrets.HARVESTPOINT_EMAIL }}
          HARVESTPOINT_PASS: ${{ secrets.HARVESTPOINT_PASS }}
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
          SMARTSHEET_SHEET_ID: ${{ secrets.SMARTSHEET_SHEET_ID }}
        run: python sync.py
